name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Release preflight
        run: npm run release:preflight

      - name: Build
        run: npm run build

  android-sync:
    name: Android Capacitor sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    env:
      WAQQI_VERSION_CODE: ${{ github.run_number }}
      WAQQI_VERSION_NAME: 1.0.${{ github.run_number }}-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Android shell
        run: npm run android:sync

      - name: Configure Java 21 (ML Kit plugin requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # setup-android provisions command-line tools and exposes sdkmanager.
      # Override its obsolete default package list ("tools platform-tools").
      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Assemble Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify Android artifact identity, version and permissions
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.ahmedelmadni.waqqi'"
          echo "$BADGING" | grep -F "versionCode='$WAQQI_VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='$WAQQI_VERSION_NAME'"

          PERMISSIONS="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")"
          echo "$PERMISSIONS"
          echo "$PERMISSIONS" | grep -F "android.permission.INTERNET"
          echo "$PERMISSIONS" | grep -F "android.permission.CAMERA"
          if echo "$PERMISSIONS" | grep -Fq "com.google.android.gms.permission.AD_ID"; then
            echo "Advertising ID permission was merged into the final APK unexpectedly"
            exit 1
          fi

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: waqqi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify release-signing plumbing with an ephemeral CI key
        shell: bash
        run: |
          CI_KEYSTORE="$RUNNER_TEMP/waqqi-ci-release.jks"
          keytool -genkeypair -v             -keystore "$CI_KEYSTORE"             -storepass changeit             -alias waqqi-ci             -keypass changeit             -keyalg RSA             -keysize 2048             -validity 2             -dname "CN=Waqqi CI, OU=CI, O=Waqqi, L=Riyadh, C=SA"
          cd android
          WAQQI_REQUIRE_SIGNED_RELEASE=true           WAQQI_KEYSTORE_PATH="$CI_KEYSTORE"           WAQQI_KEYSTORE_PASSWORD=changeit           WAQQI_KEY_ALIAS=waqqi-ci           WAQQI_KEY_PASSWORD=changeit           ./gradlew :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          rm -f "$CI_KEYSTORE"

      - name: Build unsigned Android release bundle
        run: |
          cd android
          ./gradlew :app:bundleRelease --no-daemon

      - name: Upload unsigned Android release AAB
        uses: actions/upload-artifact@v4
        with:
          name: waqqi-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

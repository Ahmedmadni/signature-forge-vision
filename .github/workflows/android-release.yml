name: Android signed release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name, e.g. 1.0.0"
        required: true
        type: string
      version_code:
        description: "Monotonic Android version code, e.g. 100"
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-aab:
    name: Build signed Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WAQQI_VERSION_NAME: ${{ inputs.version_name }}
      WAQQI_VERSION_CODE: ${{ inputs.version_code }}
      WAQQI_REQUIRE_SIGNED_RELEASE: "true"
      WAQQI_KEYSTORE_PASSWORD: ${{ secrets.WAQQI_KEYSTORE_PASSWORD }}
      WAQQI_KEY_ALIAS: ${{ secrets.WAQQI_KEY_ALIAS }}
      WAQQI_KEY_PASSWORD: ${{ secrets.WAQQI_KEY_PASSWORD }}
      WAQQI_KEYSTORE_PATH: ${{ github.workspace }}/android/waqqi-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate release version inputs
        shell: bash
        run: |
          [[ "$WAQQI_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || (echo "version_code must be a positive integer" && exit 1)
          [[ "$WAQQI_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || (echo "version_name must look like 1.0.0" && exit 1)

      - name: Verify repository release checks
        run: npm run check

      - name: Decode Android keystore
        shell: bash
        env:
          WAQQI_KEYSTORE_BASE64: ${{ secrets.WAQQI_KEYSTORE_BASE64 }}
        run: |
          test -n "$WAQQI_KEYSTORE_BASE64" || (echo "Missing WAQQI_KEYSTORE_BASE64 secret" && exit 1)
          printf '%s' "$WAQQI_KEYSTORE_BASE64" | base64 --decode > "$WAQQI_KEYSTORE_PATH"
          test -s "$WAQQI_KEYSTORE_PATH"

      - name: Sync Android project
        run: npm run android:sync

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build signed release APK and Play bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify release artifacts exist
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify signed APK identity and version
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.ahmedelmadni.waqqi'"
          echo "$BADGING" | grep -F "versionCode='$WAQQI_VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='$WAQQI_VERSION_NAME'"

          PERMISSIONS="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")"
          echo "$PERMISSIONS"
          echo "$PERMISSIONS" | grep -F "android.permission.INTERNET"
          echo "$PERMISSIONS" | grep -F "android.permission.CAMERA"
          if echo "$PERMISSIONS" | grep -Fq "com.google.android.gms.permission.AD_ID"; then
            echo "Advertising ID permission must not ship in this release"
            exit 1
          fi

      - name: Verify signed Play AAB
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          VERIFY_OUTPUT="$(jarsigner -verify -verbose -certs "$AAB" 2>&1)"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -F "jar verified."
          if echo "$VERIFY_OUTPUT" | grep -Fqi "jar is unsigned"; then
            echo "AAB is unsigned"
            exit 1
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: waqqi-release-signed-apk-${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: waqqi-play-signed-aab-${{ inputs.version_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$WAQQI_KEYSTORE_PATH"

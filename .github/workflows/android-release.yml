name: Android signed release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name, e.g. 1.0.0"
        required: true
        type: string
      version_code:
        description: "Monotonic Android version code, e.g. 100"
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-aab:
    name: Build signed Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAQQI_VERSION_NAME: ${{ inputs.version_name }}
      WAQQI_VERSION_CODE: ${{ inputs.version_code }}
      WAQQI_REQUIRE_SIGNED_RELEASE: "true"
      WAQQI_KEYSTORE_PASSWORD: ${{ secrets.WAQQI_KEYSTORE_PASSWORD }}
      WAQQI_KEY_ALIAS: ${{ secrets.WAQQI_KEY_ALIAS }}
      WAQQI_KEY_PASSWORD: ${{ secrets.WAQQI_KEY_PASSWORD }}
      WAQQI_KEYSTORE_PATH: ${{ github.workspace }}/android/waqqi-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify repository release checks
        run: npm run check

      - name: Decode Android keystore
        shell: bash
        env:
          WAQQI_KEYSTORE_BASE64: ${{ secrets.WAQQI_KEYSTORE_BASE64 }}
        run: |
          test -n "$WAQQI_KEYSTORE_BASE64" || (echo "Missing WAQQI_KEYSTORE_BASE64 secret" && exit 1)
          printf '%s' "$WAQQI_KEYSTORE_BASE64" | base64 --decode > "$WAQQI_KEYSTORE_PATH"
          test -s "$WAQQI_KEYSTORE_PATH"

      - name: Sync Android project
        run: npm run android:sync

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build signed release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon

      - name: Verify AAB exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: waqqi-play-signed-aab-${{ inputs.version_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$WAQQI_KEYSTORE_PATH"
